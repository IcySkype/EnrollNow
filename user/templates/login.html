<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EnrollNow</title>
    <style>
        /* Overall layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            display: flex;
            height: 100vh;
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-side {
            background-color: #e91e63;
            color: white;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            height: 100%;
        }

        .right-side {
            flex: 1;
            padding: 40px;
            background-color: #f8bbd0; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .login-header {
            color: #e91e63; 
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .login-form-container {
            background-color: rgba(255, 255, 255, 0.8);  /* Transparent white background */
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  /* Slight shadow for depth */
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group input {
        width: 100%;
        padding: 15px;  /* Increase padding to make the fields taller */
        font-size: 1.2rem;  /* Increase font size */
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

        .login-btn {
            background-color: #e91e63;  /* Pink background for button */
            color: white;
            padding: 15px;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .login-btn:hover {
            background-color: #c2185b;  /* Darker pink on hover */
        }

        .messages {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
            width: 100%;
        }

        .messages li {
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
        }

        /* Inline signup links */
        .signup-links {
            display: flex;
            justify-content: center;
            gap: 20px;  /* Space between the links */
            margin-top: 20px;
        }

        .signup-links a {
            color: #e91e63;  /* Pink color for links */
            text-decoration: none;
            font-size: 1rem;
        }

        .signup-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Left side: App title -->
    <div class="left-side">
        <h1 class="app-title">EnrollNow</h1>
    </div>

    <!-- Right side: Login Form -->
    <div class="right-side">
        <h2 class="login-header">Login</h2>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="login-form-container">
            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <!-- Signup Links -->
            <div class="signup-links">
                <p><a href="{% url 'student_signup' %}">Sign Up as Student</a></p>
                <p><a href="{% url 'instructor_signup' %}">Sign Up as Instructor</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
