<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Offerings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h5 class="mb-3">Student Panel</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Update Profile</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Course Offerings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Feedback</a></li>
                </ul>
                <div class="mt-auto">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Log Out</a></li>
                    </ul>
                </div>
            </div>
            
            <!-- Main content -->
            <div class="col-md-10 p-0">
                <!-- Top bar -->
                <div class="top-bar d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Course Offerings</h4>
                    <div class="user-icon">
                        <img src="path_to_user_icon.jpg" alt="User" class="rounded-circle" width="40" height="40">
                    </div>
                </div>
                
                <!-- Content area -->
                <div class="content">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Course Offerings</li>
                        </ol>
                    </nav>
                    
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Search">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col">
                            <select class="form-select">
                                <option>COLLEGE OF COMPUTER STUDIES</option>
                            </select>
                        </div>
                        <div class="col">
                            <select class="form-select">
                                <option>INFORMATION TECHNOLOGY</option>
                            </select>
                        </div>
                        <div class="col">
                            <select class="form-select">
                                <option>PRE-REQUISITE</option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="openSlotsOnly">
                                <label class="form-check-label" for="openSlotsOnly">Open Slots Only</label>
                            </div>
                        </div>
                        <div class="col-auto ">
                            <button class="btn submit-button">Submit</button>
                        </div>
                    </div>
                    
                    <table class="table table-bordered">
                        <thead class="table-header">
                            <tr>
                                <th>Course Code</th>
                                <th>Description</th>
                                <th>Section</th>
                                <th>Days</th>
                                <th>Time</th>
                                <th>Open Slots</th>
                                <th>Exclusive for</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Add table rows here -->
                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td style="text-align: center;"><button class="btn edit-button">Edit</button></td>
                            </tr>
                            <!-- Repeat for more rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
